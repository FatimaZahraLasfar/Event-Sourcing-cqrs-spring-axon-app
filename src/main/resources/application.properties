spring.application.name=event-cqrs-axon-app
server.port=8066
axon.axonserver.enabled=false
#spring.h2.console.enabled=true
#spring.datasource.url=jdbc:h2:mem:accounts-
spring.datasource.url=jdbc:postgresql://localhost:5432/es-accounts_db
spring.datasource.username=admin
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Axon Framework 5 - Jackson 2 conversion
axon.converter.general=jackson2
axon.converter.messages=jackson2
axon.converter.events=jackson2

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE